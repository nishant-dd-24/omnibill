services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: php artisan serve --host=0.0.0.0 --port=8000
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
    environment:
      - DB_HOST=pgsql
      - REDIS_HOST=redis
    depends_on:
      - pgsql
      - redis
      - minio

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: php artisan horizon
    volumes:
      - .:/var/www/html
    depends_on:
      - pgsql
      - redis

  pgsql:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: omnibill
      POSTGRES_USER: omnibill
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgsql-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":8900"
    environment:
      MINIO_ROOT_USER: omnibill
      MINIO_ROOT_PASSWORD: secretpassword
    ports:
      - "9000:9000"
      - "8900:8900"
    volumes:
      - minio-data:/data

volumes:
  pgsql-data:
  redis-data:
  minio-data:
